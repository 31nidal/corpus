<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyCorpus — comparaison visuelle</title>
<style>body{margin:0;background:#f7faf9;color:#203235;font:15px system-ui,sans-serif}header{padding:24px;border-bottom:1px solid #dfe9e7;background:white}h1{font-size:24px;margin:0 0 8px}p{color:#5d7275}label{display:inline-flex;gap:8px;align-items:center;margin-right:20px}select{padding:10px;border:1px solid #dfe9e7;border-radius:10px;background:white;color:#203235}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}figure{margin:0;min-width:0}figcaption{padding:12px 0;font-weight:600}img{width:100%;display:block;border:1px solid #dfe9e7;border-radius:14px}figure.mobile img{max-width:390px;margin:auto}#missing{padding:30px;background:white;border-radius:14px}@media(max-width:700px){.compare{grid-template-columns:1fr}}</style>
<header><h1>MyCorpus — avant / après</h1><p>Mêmes parcours et données de démonstration. Captures en état stable. Les vues initiales sont disponibles à 1440 et 390 px.</p>
<label>Écran <select id="screen"><option value="atlas3d">Atlas 3D</option><option value="cours">Cours</option><option value="flashcards">Flashcards</option><option value="decks">Decks</option><option value="revision">Révision</option><option value="mes-cours">Mes cours</option><option value="cerveau">Atlas Cerveau</option><option value="coeur">Atlas Cœur</option><option value="qcm">QCM apprentissage</option><option value="examen">Examen blanc</option><option value="compte">Compte</option></select></label>
<label>Largeur <select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option></select></label>
<label>Thème <select id="theme"><option value="light">Clair</option><option value="dark">Sombre</option></select></label></header>
<main class="compare"><figure id="beforeFigure"><figcaption>Avant — bca46e5</figcaption><img id="before" alt="Interface initiale"><p id="missing" hidden>Pas de capture initiale à cette largeur. Choisissez 1440 ou 390 px pour une comparaison directe.</p></figure><figure id="afterFigure"><figcaption>Après — parcours MyCorpus</figcaption><img id="after" alt="Interface harmonisée"></figure></main>
<script>const screenSelect=document.querySelector('#screen'),widthSelect=document.querySelector('#width'),themeSelect=document.querySelector('#theme');const imageRoot=location.pathname.includes('/docs/')?'../tests/artifacts/design/':'';function render(){const suffix=`${screenSelect.value}-${widthSelect.value}-${themeSelect.value}.png`;const initial=['1440','390'].includes(widthSelect.value);document.querySelector('#before').hidden=!initial;document.querySelector('#missing').hidden=initial;if(initial)document.querySelector('#before').src=imageRoot+'before-'+suffix;document.querySelector('#after').src=imageRoot+'after-'+suffix;for(const id of ['beforeFigure','afterFigure'])document.querySelector('#'+id).classList.toggle('mobile',widthSelect.value==='390')}for(const select of [screenSelect,widthSelect,themeSelect])select.addEventListener('change',render);render()</script></html>
